<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Programmer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <h1>AI Programmer</h1>
    <p class="subtitle">Business task -> planning -> code -> deploy -> auto-fix loop</p>

    <section class="card">
      <h2>1. Upload markdown context</h2>
      <form id="upload-form">
        <input type="file" id="context-file" accept=".md" required>
        <button type="submit">Upload .md</button>
      </form>
      <ul id="context-list"></ul>
    </section>

    <section class="card">
      <h2>2. Enter business task</h2>
      <form id="task-form">
        <label for="architect-prompt">Architect agent prompt</label>
        <textarea id="architect-prompt" rows="6" placeholder="Custom architect prompt...">{{ architect_system_prompt }}</textarea>
        <label for="git-url">Git repository URL</label>
        <input type="url" id="git-url" placeholder="https://github.com/owner/repo.git" required>
        <button type="button" id="test-git-auth">Test Git auth</button>
        <div id="git-auth-result"></div>
        <label for="deploy-dir">Deploy directory on Linux server</label>
        <input type="text" id="deploy-dir" placeholder="/opt/myapp" required>
        <label for="use-repo-context">
          <input type="checkbox" id="use-repo-context" checked>
          Use pulled Git code as model context (review/change existing project)
        </label>
        <label for="task-text">Business task</label>
        <textarea id="task-text" rows="8" placeholder="Describe business task and expected outcome..." required></textarea>
        <button type="button" id="generate-arch-spec">Generate TZ</button>
        <label for="architecture-spec">Architecture TZ (editable, approve before run)</label>
        <textarea id="architecture-spec" rows="14" placeholder="Generated architecture specification will appear here..."></textarea>
        <button type="submit">Согласовано: Start agent cycle</button>
      </form>
    </section>

    <section class="card">
      <h2>3. Runs</h2>
      <div id="runs"></div>
    </section>
  </main>

  <script>
    let selectedRunId = null;

    function eventClass(ev) {
      const stage = (ev.stage || "").toLowerCase();
      const payload = ev.payload || {};
      if (stage === "error" || stage === "failed") return "event-failed";
      if (payload.ok === false) return "event-failed";
      if (stage === "done" || payload.ok === true) return "event-success";
      return "event-neutral";
    }

    async function api(url, options = {}) {
      const response = await fetch(url, options);
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || "Request failed");
      }
      return response.json();
    }

    async function loadContextDocs() {
      const docs = await api("/api/context");
      const list = document.getElementById("context-list");
      list.innerHTML = "";
      docs.forEach(doc => {
        const li = document.createElement("li");
        li.textContent = doc.name;
        list.appendChild(li);
      });
    }

    async function loadRuns() {
      const runs = await api("/api/runs");
      const container = document.getElementById("runs");
      container.innerHTML = "";
      runs.sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
      runs.forEach(run => {
        const card = document.createElement("article");
        card.className = "run";
        if (selectedRunId === run.run_id) {
          card.classList.add("selected");
        }
        card.innerHTML = `
          <header>
            <strong>${run.run_id}</strong>
            <span class="status status-${run.status}">${run.status}</span>
          </header>
          <p><b>Attempt:</b> ${run.current_attempt}/${run.max_attempts}</p>
          <p><b>Git:</b> ${run.git_url || "-"}</p>
          <p><b>Deploy dir:</b> ${run.deploy_project_dir || "-"}</p>
          <p><b>Repo context:</b> ${run.use_repo_context ? "ON" : "OFF"}</p>
          <p>${run.task_text}</p>
        `;
        card.onclick = async () => {
          selectedRunId = run.run_id;
          await loadRuns();
          await loadRunDetails(run.run_id);
        };
        container.appendChild(card);
      });
      if (selectedRunId) {
        await loadRunDetails(selectedRunId);
      }
    }

    async function loadRunDetails(runId) {
      const run = await api(`/api/runs/${runId}`);
      const old = document.getElementById("run-details");
      if (old) old.remove();

      const panel = document.createElement("article");
      panel.id = "run-details";
      panel.className = "card";
      const events = run.events.map(ev => {
        const payload = Object.keys(ev.payload || {}).length ? `<pre>${JSON.stringify(ev.payload, null, 2)}</pre>` : "";
        return `<li class="${eventClass(ev)}"><b>[${ev.stage}]</b> ${ev.message}<small>${ev.ts}</small>${payload}</li>`;
      }).join("");
      panel.innerHTML = `
        <h3>Run details: ${run.run_id}</h3>
        <p><b>Repo context mode:</b> ${run.use_repo_context ? "ON (review/change pulled code)" : "OFF (generate from scratch context)"}</p>
        <ul class="events">${events || "<li>No events yet</li>"}</ul>
      `;
      document.querySelector(".container").appendChild(panel);
    }

    document.getElementById("upload-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("context-file");
      if (!input.files.length) return;
      const data = new FormData();
      data.append("file", input.files[0]);
      await api("/api/context/upload", { method: "POST", body: data });
      input.value = "";
      await loadContextDocs();
    });

    document.getElementById("generate-arch-spec").addEventListener("click", async () => {
      const taskText = document.getElementById("task-text").value.trim();
      const architectPrompt = document.getElementById("architect-prompt").value.trim();
      if (!taskText) {
        alert("Fill business task first");
        return;
      }
      const result = await api("/api/architect/draft", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          task_text: taskText,
          architect_prompt: architectPrompt || null
        })
      });
      document.getElementById("architecture-spec").value = result.architecture_spec || "";
    });

    document.getElementById("task-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const taskText = document.getElementById("task-text").value.trim();
      const gitUrl = document.getElementById("git-url").value.trim();
      const deployDir = document.getElementById("deploy-dir").value.trim();
      const architectPrompt = document.getElementById("architect-prompt").value.trim();
      const architectureSpec = document.getElementById("architecture-spec").value.trim();
      const useRepoContext = document.getElementById("use-repo-context").checked;
      if (!taskText || !gitUrl || !deployDir || !architectureSpec) {
        alert("Task, git URL, deploy dir and approved TZ are required.");
        return;
      }
      const payload = JSON.stringify({
        task_text: taskText,
        git_url: gitUrl,
        deploy_project_dir: deployDir,
        architecture_spec: architectureSpec,
        architect_prompt: architectPrompt || null,
        use_repo_context: useRepoContext
      });
      const result = await api("/api/architect/approve-start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload
      });
      selectedRunId = result.run_id;
      await loadRuns();
    });

    document.getElementById("test-git-auth").addEventListener("click", async () => {
      const gitUrl = document.getElementById("git-url").value.trim();
      if (!gitUrl) {
        alert("Fill Git URL first");
        return;
      }
      const resultEl = document.getElementById("git-auth-result");
      resultEl.textContent = "Testing...";
      try {
        const result = await api("/api/git-auth/test", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ git_url: gitUrl })
        });
        const status = result.ok ? "OK" : "FAILED";
        resultEl.textContent = `Git auth test: ${status}. ${result.message}`;
      } catch (error) {
        resultEl.textContent = `Git auth test error: ${error.message}`;
      }
    });

    async function bootstrap() {
      const config = await api("/api/config");
      document.getElementById("deploy-dir").value = config.deploy_project_dir || "";
      document.getElementById("architect-prompt").value = config.architect_system_prompt || "";
      await loadContextDocs();
      await loadRuns();
      setInterval(loadRuns, 3000);
    }

    bootstrap().catch(err => alert(err.message));
  </script>
</body>
</html>
